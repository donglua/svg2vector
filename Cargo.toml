[package]
name = "svg2vector"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Convert SVG icons into Android VectorDrawable XML without a JVM"
license = "Apache-2.0"
repository = "https://github.com/donglua/svg2vector"
readme = "README.md"
keywords = ["svg", "android", "vectordrawable", "cli"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
roxmltree = "0.20"
svgtypes = "0.15"
thiserror = "2"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
